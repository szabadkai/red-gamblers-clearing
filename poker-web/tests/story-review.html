<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <base href="../">
 <title>RED story review</title>
 <link rel="stylesheet" href="./style.css">
 <link rel="stylesheet" href="./menu.css">
</head>
<body>
 <main>Opening the forest…</main>
 <script type="module">
  // Exercise the same menu, HUD and input targets as the playable page.
  const response = await fetch('./index.html');
  if (!response.ok) throw new Error('Could not load game controls');
  const page = new DOMParser().parseFromString(await response.text(), 'text/html');
  document.querySelector('main').replaceWith(document.importNode(page.querySelector('main'), true));
  await import('./tests/story-review.mjs');
 </script>
</body>
</html>
